<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background-color: #000;
            margin: 0;
            font-family: 'Press Start 2P', cursive;
            color: #fff;
        }

        h1 {
            margin-bottom: 20px;
            font-size: 2em;
        }

        canvas {
            border: 2px solid #fff;
            background-color: #000000;
        }

        .controls {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 400px;
            margin-top: 20px;
        }

        .grid-toggle, .speed-control {
            margin-top: 10px;
        }

        footer {
            margin-top: 20px;
            font-size: 9px;
            color: #666;
            text-align: center;
        }
    </style>
</head>
<body>
    <h1>Snake</h1>
    <canvas width="400" height="400" id="game"></canvas>
    <div class="controls">
        <label class="speed-control">Speed : <input type="range" id="speed" min="1" max="10" value="4"></label>
        <label class="grid-toggle"><input type="checkbox" id="toggleGrid"> Display the grid</label>
        <a href="snake_smart.html">Play without a keyboard</a>
    </div>
    <footer>
        Code inspiration from: <a href="https://gist.github.com/ZiKT1229/5935a10ce818ea7b851ea85ecf55b4da" target="_blank">Gist GitHub</a>
    </footer>
    <script>
        var canvas = document.getElementById('game');
        var context = canvas.getContext('2d');
        var grid = 16;
        var count = 0;
        var speed = 4;
        var showGrid = false;
        var score = 0;
        var touchStartX, touchStartY;
        var colors = ['#33A8C7', '#52E3E1', '#A0E426', '#FDF148', '#FFAB00', '#F77976', '#F050AE', '#D883FF', ];

        var snake = { x: 160, y: 160, color:['#9336FD'], dx: grid, dy: 0, cells: [], maxCells: 4 };
        var apple = { x: 320, y: 320, color: colors[Math.floor(Math.random() * colors.length)] };

        function getRandomInt(min, max) {
            return Math.floor(Math.random() * (max - min)) + min;
        }

        function loop() {
            requestAnimationFrame(loop);
            if (++count < speed) return;
            count = 0;
            context.clearRect(0, 0, canvas.width, canvas.height);

            if (showGrid) {
                context.strokeStyle = '#222';
                for (let x = 0; x < canvas.width; x += grid) {
                    for (let y = 0; y < canvas.height; y += grid) {
                        context.strokeRect(x, y, grid, grid);
                    }
                }
            }

            snake.x += snake.dx;
            snake.y += snake.dy;

            if (snake.x < 0) snake.x = canvas.width - grid;
            else if (snake.x >= canvas.width) snake.x = 0;
            if (snake.y < 0) snake.y = canvas.height - grid;
            else if (snake.y >= canvas.height) snake.y = 0;

            snake.cells.unshift({ x: snake.x, y: snake.y });
            if (snake.cells.length > snake.maxCells) snake.cells.pop();

            context.fillStyle = apple.color;
            context.fillRect(apple.x, apple.y, grid - 1, grid - 1);

            snake.cells.forEach(function (cell, index) {
                context.fillStyle = cell.color;
                context.fillRect(cell.x, cell.y, grid - 1, grid - 1);
                if (cell.x === apple.x && cell.y === apple.y) {
                    snake.maxCells++;
                    score++;
                    apple.x = getRandomInt(0, 25) * grid;
                    apple.y = getRandomInt(0, 25) * grid;
                    apple.color = colors[Math.floor(Math.random() * colors.length)];
                }
            });

            context.fillStyle = '#fff';
            context.font = '20px monospace';
            context.fillText('Score: ' + score, 10, 20);
        }

        document.addEventListener('keydown', function (e) {
            if (e.which === 37 && snake.dx === 0) {
                snake.dx = -grid;
                snake.dy = 0;
            } else if (e.which === 38 && snake.dy === 0) {
                snake.dy = -grid;
                snake.dx = 0;
            } else if (e.which === 39 && snake.dx === 0) {
                snake.dx = grid;
                snake.dy = 0;
            } else if (e.which === 40 && snake.dy === 0) {
                snake.dy = grid;
                snake.dx = 0;
            }
        });

        document.getElementById('speed').addEventListener('input', function () {
            speed = 11 - this.value;
        });

        document.getElementById('toggleGrid').addEventListener('change', function () {
            showGrid = this.checked;
        });

        requestAnimationFrame(loop);
    </script>
</body>
</html>
