<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simon</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style type="text/css">* {cursor: url(https://ani.cursors-4u.net/cursors/cur-13/cur1151.ani), url(https://ani.cursors-4u.net/cursors/cur-13/cur1151.png), auto !important;}</style><a href="https://www.cursors-4u.com/cursor/2018/03/07/pink-electricity-lightning.html" target="_blank" title="Pink Electricity Lightning"><img src="https://cur.cursors-4u.net/cursor.png" border="0" alt="Pink Electricity Lightning" style="position:absolute; top: 0px; right: 0px;" /></a>

    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background-color: #000;
            margin: 0;
            font-family: 'Press Start 2P', cursive;
            color: #fff;
        }
        #simon-game {
            display: grid;
            grid-template-columns: repeat(2, 100px);
            gap: 10px;
        }
        .simon-button {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            cursor: pointer;
            transition: transform 0.2s, opacity 0.3s;
        }
        .simon-button:active {
            transform: scale(0.9);
        }
        #start-button, #switch-button {
            margin-top: 20px;
            padding: 10px 20px;
            background-color: #ff69b4;
            color: #fff;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }
        #start-button:hover, #switch-button:hover {
            background-color: #e0598b;
        }
        
    </style>
</head>
<body>
    <h1>Simon</h1>
    <div id="simon-game">
        <div id="button-1" class="simon-button" style="background-color: #33A8C7;"></div>
        <div id="button-2" class="simon-button" style="background-color: #A0E426;"></div>
        <div id="button-3" class="simon-button" style="background-color: #FFAB00;"></div>
        <div id="button-4" class="simon-button" style="background-color: #D883FF;"></div>
    </div>
    <button id="start-button">Start</button>
    <button id="switch-button" onclick="window.location.href='simon-hexagon.html'">Play with 6 colours</button>

    <script>
        const sounds = {
            '1': new Audio('sound1.mp3'),
            '2': new Audio('sound2.mp3'),
            '3': new Audio('sound3.mp3'),
            '4': new Audio('sound4.mp3')
        };
        const buttons = {
            '1': document.getElementById('button-1'),
            '2': document.getElementById('button-2'),
            '3': document.getElementById('button-3'),
            '4': document.getElementById('button-4')
        };

        const colors = ['1', '2', '3', '4'];
        let sequence = [];
        let playerSequence = [];
        let level = 1;

        function startGame() {
            sequence = [];
            playerSequence = [];
            level = 1;
            addToSequence();
            playSequence();
        }

        function addToSequence() {
            const randomColor = colors[Math.floor(Math.random() * colors.length)];
            sequence.push(randomColor);
        }

        function playSequence() {
            let i = 0;
            const interval = setInterval(() => {
                if (i >= sequence.length) {
                    clearInterval(interval);
                    return;
                }
                blinkButton(buttons[sequence[i]]);
                i++;
            }, 800);
        }

        // function blinkButton(button) {
        //     button.style.opacity = '0.5';
        //     setTimeout(() => {
        //         button.style.opacity = '1';
        //     }, 300);
        // }

            function blinkButton(button) {
        const color = button.id.split('-')[1];
        button.style.opacity = '0.5';
        sounds[color].currentTime = 0; // Réinitialise le son
        sounds[color].play(); // Joue le son
        setTimeout(() => {
            button.style.opacity = '1';
        }, 300);
      }

        function checkPlayerSequence() {
            if (JSON.stringify(playerSequence) === JSON.stringify(sequence)) {
                level++;
                playerSequence = [];
                addToSequence();
                setTimeout(playSequence, 1000);
            } else {
                alert(`Game Over! You have reached the level ${level}`);
                document.location.reload();
            }
        }

        document.getElementById('start-button').addEventListener('click', startGame);

        Object.values(buttons).forEach(button => {
            button.addEventListener('click', () => {
                const color = button.id.split('-')[1];
                playerSequence.push(color);
                blinkButton(button);
                if (playerSequence.length === sequence.length) {
                    setTimeout(checkPlayerSequence, 500);
                }
            });
        });
    </script>

<style>
#global-menu-home{position:fixed;top:12px;left:12px;z-index:9999;padding:8px 12px;border:2px solid #ff69b4;border-radius:10px;background:rgba(0,0,0,.72);color:#fff;text-decoration:none;font-family:"Press Start 2P",cursive;font-size:11px;line-height:1.2;box-shadow:0 0 10px rgba(255,105,180,.35)}
#global-menu-home:hover{background:#ff69b4;color:#001a4d}
</style>
<a id="global-menu-home" href="../index.html" aria-label="Back to menu">Menu</a>
</body>
</html>
